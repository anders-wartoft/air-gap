# Used in some log events to identify the source
id=Upstream_1
# Used in the MTU code
nic=lo0
# UDP target (downstream, use static arp and route to be able to send packets over a diode)
#targetIP=[::1]
targetIP=127.0.0.1
# UDP target port
targetPort=1234
# Kafka source. If more than one, separate the servers with a comma ,
#bootstrapServers=192.168.153.143:9092,192.168.153.144:9092
# Topic to read
#topic=upstream
# Kafka group id to use. If several threads are used, this is prepended to the thread names.
#groupID=test
# Read from this time instead of starting at the end
#    2024-01-28T10:24:55+01:00
from=
# Downstream public key file. Leave empty to disable encryption
#publicKeyFile=certs/server2.pem
# For testing, you can use random, else use kafka
#source=random
source=random
# Every n seconds, generate a new symmetric key
generateNewSymmetricKeyEvery=50
# Set payloadSize to auto or 0 will query the nic of the mtu
payloadSize=auto

# Bound Kafka prefetch and large-record memory. kafkaMaxMessageBytes must be
# at least as large as Kafka's permitted record size. Each sending thread has
# its own consumer and bounded channel.
kafkaFetchDefaultBytes=1048576
kafkaMaxMessageBytes=104857600
kafkaChannelBufferSize=4
# Sarama abandons a partition subscription when the application does not drain
# its channel between processing-time ticks. Upstream processes and sends each
# record synchronously, so this must cover rate limiting, memory throttling,
# compression, encryption, fragmentation, transport writes and retries.
kafkaMaxProcessingTimeMs=30000
# Milliseconds between attempts to connect to Kafka at startup. Unreachable or
# not-ready brokers are retried indefinitely (WARN); configuration, certificate
# and authorization errors stop upstream.
kafkaRetryInterval=5000

# Pause Kafka record admission at the high watermark and resume at the low
# watermark. memoryLimitBytes=0 detects the cgroup/system limit. A positive
# value may lower the detected limit. goMemoryLimitPercent=0 disables the Go
# runtime soft heap limit.
memoryLimitBytes=0
memoryHighWatermarkPercent=80
memoryLowWatermarkPercent=70
memoryCheckIntervalMs=100
goMemoryLimitPercent=70

# Configurable Airgap events. Every event is written as LEVEL:message, or NONE
# to turn the event off. The level is the text before the first colon; the rest
# is the message. Every configuration property is available as a {placeholder},
# written in either notation: {lostEventDirectory} and {lost_event_directory}
# are the same placeholder. An unknown placeholder is left as written, so a typo
# is visible instead of rendering an empty field.
#
# memoryHighWatermarkLog is written when Kafka record admission is paused, and
# memoryLowWatermarkLog when it resumes. Both may use {memoryCurrentBytes},
# {memoryUsedLimitBytes}, {memoryUsedPercent} and {memorySource}.
memoryHighWatermarkLog=WARN:Upstream {upstreamId} entering high memory watermark. Pausing Kafka record admission at {memoryCurrentBytes} of {memoryUsedLimitBytes} bytes ({memoryUsedPercent} percent, from {memorySource}).
memoryLowWatermarkLog=NONE

# Airgap Lost Event (ALE) guard. Records larger than maxEventBytes, and records
# that cannot be encrypted, are replaced by a guard payload that keeps the same
# message id, so downstream still sees the offset and the gap detector does not
# resend it.
# maxEventBytes=0 disables the ceiling. Keep it at or below kafkaMaxMessageBytes.
# lostEventGuard=false discards the record instead of delivering the guard.
# lostEvent is the log record written when an event is lost.
# airgapLostEventMessage is the payload delivered in place of the record. Keep
# the AIRGAP LOST EVENT marker so downstream can find every lost event.
# airgapLostEventMessageFormat is text (default) or json. JSON templates must
# be objects and placeholders must occur inside JSON string values; substituted
# values are JSON-escaped automatically.
# Both may use {topic_name}, {partition}, {row}, {reason}, {eventBytes} and
# {lostEventFile} on top of every configuration property.
# lostEventDirectory stores the original payload for forensics; empty disables
# it, and then the guard says so instead of pointing at a directory.
maxEventBytes=0
lostEventGuard=true
lostEvent=INFO:Event {topic_name} {partition}:{row} couldn't be delivered due to {reason}. The message can be found in its entirety on upstream machine {upstream_id}, in {lostEventDirectory}.
airgapLostEventMessageFormat=text
airgapLostEventMessage=AIRGAP LOST EVENT: Event {topic_name} {partition}:{row} couldn't be delivered due to {reason}. The message can be found in its entirety on upstream machine {upstream_id}, in {lostEventDirectory}. Max message length is {kafkaMaxMessageBytes}.
lostEventDirectory=/airgap/lost_events/
# Before each lost-event write, files older than the deletion age are removed,
# then non-zip files older than the compression age are zipped. Zero disables
# the corresponding action. If the new payload still does not fit, the oldest
# remaining files are removed first until it does or no files remain.
lostEventDirectoryCompressAfterDays=7
lostEventDirectoryDeleteAfterDays=60
# Emit a local log record and TYPE_STATUS message whenever Go removes a content
# file. Downstream routes STATUS messages to internalTopic. The message can use
# {fileName}, {fileDate}, {diskFreeBytes}, {fileSize} and {action}; action is
# compressed, deleted, evicted or write_failed. NONE disables this message.
lostMessageTruncatedMessage=AIRGAP LOST MESSAGE TRUNCATED: The message file {fileName} created on {fileDate} was truncated by upstream due to lack of disc space. Current disc free space is {diskFreeBytes} bytes and the truncated file was {fileSize} bytes.
lostMessageTruncatedMessageFormat=text
# Log level
logLevel=DEBUG
# Log statistics every N seconds (0 = disabled)
logStatistics=10
# Event per second. -1 for as fast as possible
eps=3
# After reading the config, where should we send the logs? Default is stdout
#logFileName=./tmp/upstream.log
# Add more sending threads (only valid with source=kafka). sendingThread needs to be an array of objects
# Format: {"name": "thread_name", "offset": offset_in_seconds}
#sendingThreads=[{"now": 0}, {"3minutes": -180}]
#sendingThreads=[{"0seconds": 0}]
# Add this value to each source partition before sending (for stream merging scenarios)
# Example: if source partitions are 0..99 and partitionStartValue=100, downstream partitions become 100..199
#partitionStartValue=0
# Log output format: text (default) or otel for OpenTelemetry Logs as OTLP/JSON
#logFormat=otel
# Hash the payload of every log record: none (default), SHA256, SHA384, SHA512,
# SHA3-256, SHA3-384 or SHA3-512. See doc/Logging.md
#hash=SHA256
# Chain log records together and write an anchor record every N records.
# 0 (default) disables chaining. See doc/Logging.md
#hash-chain=10
