# Air-gap upstream config for TC-13 chain run.
#
# TC-13 is about dedup monitoring: verify dedup logs received/sent/
# missing counters at a configurable interval (REQ-27/28). The chain
# relies on upstream to intentionally forward only half the events so
# dedup's MISSING-REPORT lines show meaningful non-zero counters.
#
# deliverFilter=2,4,6 → chain delivers Kafka offsets where pos=2 (even
# offsets 0,2,4,… including 0 after the posMod fix in filter.go). For
# the TC-9/10/12 scale (100 events round-robined across 5 partitions,
# 20 per partition at offsets 0..19), the chain forwards exactly 10
# events per partition = 50 total. The other 50 become MISSING at the
# dedup layer, which is what we want to measure.
#
# eps=50 UDP TokenBucket matches the TC-9/10/12 pattern that avoids
# UDP burst loss on busy Docker hosts.

id=Upstream_13
nic=lo0

targetIP=kafka-downstream.sitia.nu
targetPort=1234

bootstrapServers=kafka-upstream.sitia.nu:9092,kafka-upstream.sitia.nu:8092
topic=transfer
groupID=13

from=

source=kafka
logLevel=INFO
encryption=false
generateNewSymmetricKeyEvery=50
payloadSize=1500

eps=50

deliverFilter=2,4,6

sendingThreads=[{"No-delay": 0}]
