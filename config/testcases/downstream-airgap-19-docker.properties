# Air-gap downstream config for TC-19 chain run.
#
# Standard UDP-to-Kafka receiver, no topic translation — transfer stays
# transfer on kafka-downstream so tc19-inputfilter-test.sh can read it
# straight with kafka-console-consumer.

id=Downstream_19
nic=lo0

targetIP=0.0.0.0
targetPort=1234

bootstrapServers=kafka-downstream.sitia.nu:9092
internalTopic=airgap-internal

target=kafka
logLevel=INFO
clientId=downstream-19

privateKeyFiles=certs/private*.pem

mtu=1500
