# Air-gap upstream config for TC-14 chain run.
#
# Mirrors upstream-airgap-13-docker.properties: deliverFilter=2,4,6
# intentionally forwards only half the stream so dedup accumulates
# gaps on the `gaps` topic — TC-14's whole point is exporting those
# gaps with `create` and refilling them with `resend`.
#
# eps=50 UDP TokenBucket throttle matches the TC-9/10/12/13 pattern
# that avoids UDP burst loss on busy Docker hosts. nic/targetIP/
# bootstrapServers below are placeholders — the upstream-a compose
# service always overrides them via AIRGAP_UPSTREAM_NIC=eth0,
# AIRGAP_UPSTREAM_TARGET_IP=downstream, AIRGAP_UPSTREAM_BOOTSTRAP_SERVERS.

id=Upstream_14
nic=lo0

targetIP=kafka-downstream.sitia.nu
targetPort=1234

bootstrapServers=kafka-upstream.sitia.nu:9092,kafka-upstream.sitia.nu:8092
topic=transfer
groupID=14

from=

source=kafka
logLevel=INFO
encryption=false
generateNewSymmetricKeyEvery=50
payloadSize=1500

eps=50

deliverFilter=2,4,6

sendingThreads=[{"No-delay": 0}]
