# Air-gap downstream config for TC-4 (Docker chain run).
#
# Docker-specific:
#   - targetIP=0.0.0.0 so UDP from the upstream-a container reaches us.
#   - mtu fixed at 1500 (the generic docker-compose network MTU) instead of
#     "auto" (unreliable inside containers).
#
# Note on caFile: the two Kafka clusters in the test env are signed by
# DIFFERENT CAs — generate-kafka-certs.sh keeps any pre-existing keystore,
# and the shipped kafka-downstream.keystore.jks was issued by MyKafkaCA
# (certs/tmp/kafka-ca.crt). The upstream cluster keystore is signed by the
# newer airgap-testenv-ca (certs/kafka/ssl/testenv-ca.crt). So the airgap
# downstream has to validate against kafka-ca.crt, while the airgap upstream
# has to validate against testenv-ca.crt. The brokers' combined
# kafka-trust.jks trusts both CAs, so client certs signed by MyKafkaCA
# still work on both sides even though mTLS is disabled anyway.

id=Downstream_4
nic=lo0

targetIP=0.0.0.0
targetPort=1234

bootstrapServers=kafka-downstream.sitia.nu:9094,kafka-downstream.sitia.nu:8094
internalTopic=airgap-internal

target=kafka
verbose=true
clientId=downstream-4

logLevel=DEBUG
logStatistics=30

privateKeyFiles=certs/private*.pem

mtu=1500

# TLS to Kafka — the downstream broker server cert is signed by MyKafkaCA
certFile=certs/tmp/airgap-downstream.crt
keyFile=certs/tmp/airgap-downstream.key
caFile=certs/tmp/kafka-ca.crt
