# Docker chain-run variant of upstream-airgap-21b2.properties (TC-21 phase
# 2: cluster 2 restarted with NO deliverFilter + a fresh groupID so Kafka
# replays the whole topic from the start, closing the gaps phase 1 opened
# intentionally).
#
# targetIP overridden by docker-compose.yml; bootstrapServers overridden by
# this manifest's UPSTREAM_B_BOOTSTRAP, same as the phase-1 file; see
# upstream-airgap-21b-docker.properties.
id=Upstream_21b
nic=eth0
targetIP=downstream
targetPort=1234
source=kafka
bootstrapServers=kafka-upstream-b:9092,kafka-upstream-b-2:8092
topic=transfer
# Fresh groupID (not "21b-phase1") so this consumer has no committed
# offset and starts from the earliest record, replaying everything —
# including what phase 1's deliverFilter dropped.
groupID=21b-phase2
logLevel=DEBUG
from=
encryption=false
generateNewSymmetricKeyEvery=50
payloadSize=1500
sendingThreads=[{"No-delay": 0}]
# No deliverFilter: deliver everything this time.
compressWhenLengthExceeds=1200
logStatistics=60
eps=5

partitionStartValue=10
