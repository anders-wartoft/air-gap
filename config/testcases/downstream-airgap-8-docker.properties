# Air-gap downstream config for TC-8 (Docker chain run).
#
# Mirror of upstream-airgap-8-docker: the SIGHUP log-rotation path is
# the same code on both sides, so we rotate both logs in verify-tc8.sh.
# targetIP=0.0.0.0 so UDP (not that we send any in TC-8, but the server
# still has to bind) reaches us across the Docker bridge.

id=Downstream_8
nic=lo0

targetIP=0.0.0.0
targetPort=1234

bootstrapServers=kafka-downstream.sitia.nu:9092
internalTopic=airgap-internal

target=kafka
verbose=false
clientId=downstream-8

logLevel=INFO

privateKeyFiles=certs/private*.pem

mtu=1500

# TC-8 point of interest — SIGHUP must close+reopen this exact file.
logFileName=/tmp/downstream.log
