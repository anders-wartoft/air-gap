# LG sink for the Docker chain run of TC-3.
#
# The bare-metal procedure uses downstream-lg-3.properties (input=udp) —
# LogGenerator pretends to be the air-gap downstream. In the Docker env the
# real air-gap downstream owns UDP:1234 inside the network, so instead we
# read what it wrote to Kafka. TC-3 has no dedup profile and a single
# sendingThread, so each event should appear exactly once in
# kafka-downstream[transfer].
input=kafka
topic=transfer
client-id=downstream-lg-3
bootstrap-server=kafka-downstream.sitia.nu:9092
filter=gap
regex=_(\d+)$
duplicate-detection=true
output=cmd

