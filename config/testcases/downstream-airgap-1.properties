# Air-gap downstream config for TC-1 (Docker chain run).
#
# The default downstream-docker.properties targets stdout (target=cmd) and
# translates topics from "upstream" to "downstream", which breaks TC-1:
# nothing lands on kafka-downstream[transfer] and the LG sink sees 0.
# This file mirrors downstream-airgap-9.properties but with a TC-1 id.

id=Downstream_1
nic=lo0

targetIP=0.0.0.0
targetPort=1234

bootstrapServers=kafka-downstream.sitia.nu:9092
internalTopic=airgap-internal

target=kafka
verbose=true
clientId=downstream-1

# TC-1 upstream disables encryption by default (publicKeyFile is commented
# out) — the default is encryption=false — so no private key is strictly
# required here. We still point at the test keys so the config matches the
# other testcases if someone enables encryption later.
privateKeyFiles=certs/private*.pem

mtu=1500
