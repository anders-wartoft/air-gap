# TLS/mTLS upstream config for TC-24 chain run — "client A" (first mTLS
# client, used in Part B's two-concurrent-clients test AND as Part D's
# live cert-rotation target).
#
# tcpTLSCertFile/KeyFile/KeyPasswordFile point at WRITABLE copies under
# /airgap/tmp (NOT the read-only /airgap/certs mount) — tc24-pre-up.sh
# (PRE_UP_SCRIPT) seeds them from certs/upstream.{crt,key,key.pw} before
# this container's first start, and tc24-tls-test.sh (POST_DRAIN_SCRIPT)
# later overwrites them with upstream2's cert/key + SIGHUP to exercise
# Part D's live rotation without needing a config swap or restart.
#
# targetIP/bootstrapServers-equivalent (targetIP here) overridden by
# docker-compose.yml's AIRGAP_UPSTREAM_TARGET_IP (defaults to
# "downstream") regardless of what's written below.

id=Upstream_24a
nic=eth0
targetIP=downstream
targetPort=1234

from=
source=random
generateNewSymmetricKeyEvery=50
payloadSize=1500
logLevel=DEBUG
eps=3

transport=tcp
tcpTLSEnabled=true
tcpTLSCertFile=/airgap/tmp/tc24-rotate.crt
tcpTLSKeyFile=/airgap/tmp/tc24-rotate.key
tcpTLSKeyPasswordFile=/airgap/tmp/tc24-rotate.key.pw
tcpTLSCAFile=/airgap/certs/ca.crt
tcpTLSServerCNRegex=^nu\.sitia\.airgap\.downstream-[0-9]+$
tcpTLSCipherSuites=TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384,TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384

tcpRetryInterval=1000
tcpRetryTimes=0
tcpRetryErrorLevel=WARN
