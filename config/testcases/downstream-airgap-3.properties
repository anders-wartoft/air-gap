# Air-gap downstream config for TC-3 (Docker chain run).
#
# TC-3 is the plain-text end-to-end smoke test. Mirror of downstream-airgap-1
# with a TC-3 id: listen on 0.0.0.0 so UDP from upstream-a reaches the
# container, and write decoded events to kafka-downstream[transfer] so the
# LG sink can verify TEST_1..TEST_1000 all arrived.

id=Downstream_3
nic=lo0

targetIP=0.0.0.0
targetPort=1234

bootstrapServers=kafka-downstream.sitia.nu:9092
internalTopic=airgap-internal

target=kafka
verbose=true
clientId=downstream-3

privateKeyFiles=certs/private*.pem

mtu=1500
