# Docker chain-run variant of downstream-airgap-25b.properties (TC-25
# POSITIVE control). This file is referenced by TESTCASES.md's manual
# procedure but was never actually committed — created here.
#
# SO_RXQ_OVFL enabled: statistics must now include both "SO_RXQ_OVFL"
# (the per-interval delta) and "SO_RXQ_OVFL_TOTAL" (cumulative) keys, per
# src/downstream/downstream.go. Small CPU cost, which is why it defaults
# to disabled (see the negative control,
# downstream-airgap-25-docker.properties).
#
# logLevel=info, not debug: this config is ALSO the active downstream
# config during the bonus eps=-1 blast phase (tc25-rxqovfl-test.sh) —
# DEBUG's per-packet logging at that rate produces millions of lines in
# seconds for no benefit (the STATISTICS line this test checks prints at
# INFO regardless).

id=Downstream_25b
nic=eth0
targetIP=0.0.0.0
targetPort=1234

target=cmd
logLevel=info
clientId=downstream-25b

mtu=1500

enableRxqOvfl=true
logStatistics=5
