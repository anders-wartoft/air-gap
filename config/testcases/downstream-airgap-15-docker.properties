# Air-gap downstream config for TC-15 chain run.
#
# No topic translation — transfer stays transfer on kafka-downstream, so
# tc15-compression-test.sh can read it straight with kafka-console-consumer.
# privateKeyFiles lets the downstream decrypt the symmetric key exchange
# for the encrypted sub-phase (upstream-airgap-15b-docker.properties).

id=Downstream_15
nic=lo0

targetIP=0.0.0.0
targetPort=1234

bootstrapServers=kafka-downstream.sitia.nu:9092
internalTopic=airgap-internal

target=kafka
logLevel=INFO
clientId=downstream-15

privateKeyFiles=certs/private*.pem

mtu=1500
