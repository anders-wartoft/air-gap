# Air-gap downstream config for TC-10 (Docker chain run).
#
# Docker-friendly downstream: binds UDP to 0.0.0.0 so the upstream-a
# container's packets reach us across the Docker bridge. Writes
# everything it receives to kafka-downstream[<original-topic>] with no
# topic translation, so events from transfer2 land on transfer2.

id=Downstream_10
nic=lo0

targetIP=0.0.0.0
targetPort=1234

bootstrapServers=kafka-downstream.sitia.nu:9092
internalTopic=airgap-logs

target=kafka
logLevel=INFO
clientId=downstream-10

privateKeyFiles=certs/private*.pem

mtu=1500
