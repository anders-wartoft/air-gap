id=Upstream_34
nic=eth0
targetIP=downstream
targetPort=1234
transport=udp
bootstrapServers=kafka:9092
topic=source
groupID=tc34
from=
source=kafka
logLevel=INFO
logStatistics=0
payloadSize=1200
sendingThreads=[{"Slow-udp": 0}]
topicTranslations={"source":"transfer"}

# TC-34 deliberately limits processing to one event per second. A bounded
# franz-go poll batch must tolerate that delay without losing records.
kafkaFetchDefaultBytes=1048576
kafkaMaxMessageBytes=6291456
kafkaChannelBufferSize=1
# Retained for configuration compatibility; franz-go does not use this option.
kafkaMaxProcessingTimeMs=2000
eps=1
