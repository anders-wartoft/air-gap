id=Upstream_34
nic=eth0
targetIP=downstream
targetPort=1234
transport=udp
bootstrapServers=kafka:9092
topic=source
groupID=tc34
from=
source=kafka
logLevel=INFO
logStatistics=0
payloadSize=1200
sendingThreads=[{"Slow-udp": 0}]
topicTranslations={"source":"transfer"}

# TC-34 deliberately limits processing to one event per second. Sarama's
# historical 100 ms default abandons the subscription under this load.
kafkaFetchDefaultBytes=1048576
kafkaMaxMessageBytes=6291456
kafkaChannelBufferSize=1
kafkaMaxProcessingTimeMs=2000
eps=1
