# Air-gap upstream config for TC-8 (Docker chain run).
#
# TC-8 proves SIGHUP triggers log-file reopening (REQ-13, REQ-18, REQ-23).
# The key field is logFileName — the on-disk path the SIGHUP handler
# closes-and-reopens. We write to /tmp/ which is always writable inside
# the container (the stock upstream-airgap-8.properties uses
# ./tmp/upstream.log which doesn't exist and would fatal on startup).

id=Upstream_8
nic=lo0

targetIP=127.0.0.1
targetPort=1234

bootstrapServers=kafka-upstream.sitia.nu:9092
topic=transfer
groupID=test

from=

source=kafka
logLevel=INFO

encryption=false
generateNewSymmetricKeyEvery=50
payloadSize=1400

sendingThreads=[{"No-delay": 0}]

# TC-8 point of interest — SIGHUP must close+reopen this exact file.
logFileName=/tmp/upstream.log
