# LogGenerator producer for TC-18 chain run.
#
# No dedup in this test — a straightforward full-delivery burst to
# prove upstream/downstream's encrypted-key mTLS path works end to end.
# LogGenerator itself talks PLAINTEXT directly to Kafka (TLS is the
# air-gap binaries' and create/resend's concern, not LogGenerator's).

input=counter
string=TEST_
filter=guard
filter=gap
regex=_(\d+)$
duplicate-detection=true
output=kafka
client-id=test
topic=transfer
bootstrap-server=kafka-upstream.sitia.nu:9092
eps=100
statistics=true
limit=100
