# Docker chain-run variant of upstream-tcp.properties (TC-22: TCP
# transport, downstream restart without loss).
#
# source=random: this upstream generates its own synthetic "Random message
# N" counter internally (src/upstream/randomKafka.go) — no Kafka, no
# LogGenerator anywhere in this testcase's data path. targetIP is
# overridden by docker-compose.yml's AIRGAP_UPSTREAM_TARGET_IP (defaults
# to "downstream"), same as every other upstream-a config.
id=Upstream_22
nic=eth0
targetIP=downstream
targetPort=1234
from=
source=random
generateNewSymmetricKeyEvery=50
payloadSize=1500
logLevel=DEBUG
eps=3

transport=tcp
tcpRetryInterval=1000
tcpRetryTimes=0
tcpRetryErrorLevel=WARN
