# Docker chain-run variant of upstream-airgap-21b.properties (TC-21 phase 1:
# cluster 2, partitions 10-14, deliverFilter opens deliberate gaps).
#
# targetIP is overridden by docker-compose.yml's AIRGAP_UPSTREAM_TARGET_IP
# (defaults to "downstream"). bootstrapServers is overridden by this
# manifest's UPSTREAM_B_BOOTSTRAP=kafka-upstream-b:9092,kafka-upstream-b-2:8092
# (the second Kafka cluster, activated by the second-cluster profile).
id=Upstream_21b
nic=eth0
targetIP=downstream
targetPort=1234
source=kafka
bootstrapServers=kafka-upstream-b:9092,kafka-upstream-b-2:8092
topic=transfer
# Phase-1 groupID. Phase 2 (upstream-airgap-21b2-docker.properties) uses a
# different groupID so Kafka replays the whole topic from the start.
groupID=21b-phase1
logLevel=DEBUG
from=
encryption=false
generateNewSymmetricKeyEvery=50
payloadSize=1500
sendingThreads=[{"No-delay": 0}]
# Deliver only offsets 2, 4, 6 — deliberately drops most of this cluster's
# phase-1 stream so the dedup's gap topic shows real gaps in partitions
# 10-14 for phase 2 to close.
deliverFilter=2,4,6
compressWhenLengthExceeds=1200
logStatistics=60
eps=5

# This upstream instance owns partitions 10-14 of the downstream topic; the
# "a" cluster owns 0-4 (partitionStartValue=0) so the two clusters' counter
# IDs never collide after both land in kafka-downstream[transfer].
partitionStartValue=10
