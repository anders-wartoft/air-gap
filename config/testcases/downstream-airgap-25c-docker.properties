# TC-25 blast-phase downstream config: same as downstream-airgap-25b-
# docker.properties (SO_RXQ_OVFL enabled) but target=null instead of cmd.
#
# target=cmd prints every single received message to stdout — fine at
# normal rates, but at the blast phase's eps=-1 ("as fast as possible")
# that's 100K+ "Random message N" lines PER SECOND (observed ~1.8M in just
# 10s), ballooning docker's log storage for zero benefit to this test.
# target=null ("for performance testing" per src/downstream/downstream.go)
# discards the per-message output entirely while SO_RXQ_OVFL tracking is
# unaffected — it happens at the UDP socket layer (src/udp/receiver.go),
# upstream of and independent from whichever output target is configured.

id=Downstream_25c
nic=eth0
targetIP=0.0.0.0
targetPort=1234

target=null
logLevel=info
clientId=downstream-25c

mtu=1500

enableRxqOvfl=true
logStatistics=5
