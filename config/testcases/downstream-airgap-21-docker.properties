# Docker chain-run variant of downstream-airgap-21.properties (TC-21).
#
# Same as the bare-metal file with nic=eth0 (the container's actual
# interface; mtu is explicit below so this is mostly cosmetic) and the
# dangling commented-out TLS/topicTranslations examples dropped.
# bootstrapServers is overridden by docker-compose.yml's
# AIRGAP_DOWNSTREAM_BOOTSTRAP_SERVERS regardless of what's written below.

id=Downstream_21
nic=eth0

targetIP=0.0.0.0
targetPort=1234

bootstrapServers=kafka-downstream.sitia.nu:9092
internalTopic=airgap-internal

target=kafka
logLevel=debug
clientId=downstream-21

privateKeyFiles=certs/private*.pem

mtu=1500
