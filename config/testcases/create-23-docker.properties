# `create` config for TC-23 chain run. Exports all current gaps from
# kafka-downstream[gaps] into a JSON bundle. Same shape as create-14.properties.
# bootstrapServers is overridden by docker-compose.yml's CREATE_BOOTSTRAP
# (defaults to plaintext kafka-downstream:9092) regardless of what's
# written below.
bootstrapServers=kafka-downstream.sitia.nu:9092
topic=gaps
groupID=createResourceBundle-23
logLevel=DEBUG
limit=first
eps=200
resultFileName=./tmp/create-23-results-first.json
