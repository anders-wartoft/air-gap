# LG producer for TC-21 chain run, cluster A (kafka-upstream). Matches the
# documented manual procedure's "10 logs at 1 EPS" — small/fast on purpose;
# phase 2 re-runs this SAME config for the documented second wave (see
# PHASE2_RERUN_LG_PRODUCER in testcases/21.env), producing the same
# Cluster1_1..Cluster1_10 range again, which is what creates the expected
# "each value delivered twice" duplicates once gaps are closed.
input=counter
string=Cluster1_
filter=guard
filter=gap
regex=_(\d+)$
duplicate-detection=true
output=kafka
client-id=test
topic=transfer
bootstrap-server=kafka-upstream:9092
eps=1
statistics=true
limit=10
