# Air-gap downstream config for TC-17 chain run.
#
# Mirrors downstream-airgap-6-docker.properties's TLS config. No topic
# translation — transfer stays transfer on kafka-downstream, matching
# dedup-17-docker.env's RAW_TOPICS=transfer.

id=Downstream_17
nic=lo0

targetIP=0.0.0.0
targetPort=1234

bootstrapServers=kafka-downstream.sitia.nu:9094,kafka-downstream.sitia.nu:8094
internalTopic=airgap-internal

target=kafka
logLevel=INFO
clientId=downstream-17

privateKeyFiles=certs/private*.pem

mtu=1500

# TLS to Kafka — kafka-downstream broker cert is signed by the same CA.
# TLS to Kafka — kafka-downstream broker cert is signed by MyKafkaCA,
# NOT airgap-testenv-ca (unlike kafka-upstream — see
# upstream-airgap-17-docker.properties's comment). This asymmetry is a
# pre-existing property of this test env's cert generation history,
# not a TC-17-specific thing; TC-6's downstream config uses the exact
# same caFile for the same reason.
certFile=certs/tmp/airgap-downstream.crt
keyFile=certs/tmp/airgap-downstream.key
caFile=certs/tmp/kafka-ca.crt
