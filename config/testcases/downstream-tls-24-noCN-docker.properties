# TLS/mTLS downstream config for TC-24 Part C — one-way (server-only)
# authentication: tcpTLSClientCNRegex is empty, so the handshake succeeds
# for ANY client certificate signed by the trusted CA, without restricting
# by CN. The CA chain is still verified regardless (tcpTLSClientAuth
# stays "require" — this tests "no CN filter", not "no client cert at
# all"). Otherwise identical to downstream-tls-24-docker.properties.

id=Downstream_24c
nic=eth0
targetIP=0.0.0.0
targetPort=1234

target=cmd
logLevel=DEBUG
numReceivers=10
privateKeyFiles=certs/private*.pem
mtu=1500

transport=tcp
tcpTLSEnabled=true
tcpTLSCAFile=/airgap/certs/ca.crt
tcpTLSCertFile=/airgap/certs/downstream.crt
tcpTLSKeyFile=/airgap/certs/downstream.key
tcpTLSKeyPasswordFile=/airgap/certs/downstream.key.pw
tcpTLSClientAuth=require
tcpTLSClientCNRegex=
tcpTLSCipherSuites=TLS1.3
