# Managed configuration, including the originally reported commented property.
# privateKeyFiles=
  # tcpTLSAuthMode=invalid
id=tcp#1  # Embedded hash remains part of the instance ID.
nic=eth0
targetIP=0.0.0.0
targetPort=1234 # Listen port.
target=cmd
mtu=1500	# Maximum frame size.
logLevel=INFO
logFileName=/airgap/work/downstream.log
transport=tcp
tcpTLSAuthMode=pinned # Strict reload parser.
tcpTLSCertFile=/airgap/work/server-1.crt # Server identity.
tcpTLSKeyFile=/airgap/work/server-1.key
tcpTLSTrustedKeysDir=/airgap/work/client-trust
tcpTLSClientAuth=require
