# Docker chain-run variant of downstream-airgap-25.properties (TC-25
# NEGATIVE control): SO_RXQ_OVFL disabled (the default) — statistics must
# NOT mention it at all. See downstream-airgap-25b-docker.properties for
# the positive control (enabled).

id=Downstream_25
nic=eth0
targetIP=0.0.0.0
targetPort=1234

target=cmd
logLevel=debug
clientId=downstream-25

mtu=1500

enableRxqOvfl=false
logStatistics=5
