# Air-gap upstream config for TC-10 phase 1 (Docker chain run).
#
# TC-10's chain run reuses the TC-9 two-phase deliverFilter → gap-fill
# pattern, but on the transfer2 / dedup2 / gaps2 topic family (which is
# what the systemd bare-metal procedure uses). Phase 1 drops multiples
# of 5 on purpose; phase 2 (upstream-airgap-10b-docker) refills them
# with a fresh groupID.

id=Upstream_10
nic=lo0

targetIP=127.0.0.1
targetPort=1234

bootstrapServers=kafka-upstream.sitia.nu:9092
topic=transfer2
groupID=test

from=

source=kafka
logLevel=INFO
encryption=false
generateNewSymmetricKeyEvery=50
payloadSize=1500

# Throttle UDP output. upstream reads from Kafka without a built-in
# rate limit, so the phase-2 replay (fresh groupID → re-read 100 pre-
# staged events from offset 0) would otherwise dump 100 UDP packets
# into the socket at line rate. The downstream kernel UDP receive
# buffer absorbs them most of the time, but occasionally one is lost.
# 50 events/sec = 20 ms per packet, well inside buffer headroom.
eps=50

sendingThreads=[{"No-delay": 0}]

# Drop multiples of 5 (matches TC-9's deliberate gap pattern).
deliverFilter=1,2,3,4,6,7,8,9,11,12,13,14
