# Air-gap upstream config for TC-15 chain run — encrypted + compressed.
#
# Same as upstream-airgap-15-docker.properties plus
#   encryption=true + publicKeyFile=certs/server2.pem
# matching the committed upstream-airgap-15b.properties /
# upstream-airgap-6-docker.properties pattern. Verifies compression
# still applies when the channel is ALSO encrypted (REQ-30: "must be
# selectable ... regardless of whether encryption is used").

id=Upstream_15b
nic=lo0

targetIP=kafka-downstream.sitia.nu
targetPort=1234

bootstrapServers=kafka-upstream.sitia.nu:9092,kafka-upstream.sitia.nu:8092
topic=transfer
groupID=15

from=

source=kafka
logLevel=INFO

encryption=true
publicKeyFile=certs/server2.pem
generateNewSymmetricKeyEvery=50
payloadSize=1500

eps=50

compressWhenLengthExceeds=100

sendingThreads=[{"No-delay": 0}]
