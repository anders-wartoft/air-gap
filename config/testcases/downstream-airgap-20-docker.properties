# Docker chain-run variant of downstream-airgap-20.properties (TC-20: TCP
# transport, "downstream starts late" recovery).
#
# Same as the bare-metal file except nic=eth0 (the container's actual
# interface; mtu is explicit below so this is mostly cosmetic) and the
# dangling commented-out TLS/topicTranslations examples dropped. This
# container's actual start time is held back by STARTUP_DELAY (wired from
# DOWNSTREAM_STARTUP_DELAY in docker-compose.yml, see tests/env/entrypoint.sh)
# so upstream-a's TCP connection is genuinely unavailable for the first
# few seconds of the run — that's the behaviour TC-20 is testing.

id=Downstream_20
nic=eth0

targetIP=0.0.0.0
targetPort=1234

bootstrapServers=kafka-downstream.sitia.nu:9092
internalTopic=airgap-internal

target=kafka
logLevel=debug
clientId=downstream-20

privateKeyFiles=certs/private*.pem

mtu=1500

transport=tcp
