# Air-gap upstream config for TC-15 chain run — unencrypted, compressed.
#
# Mirrors upstream-airgap-15.properties: compressWhenLengthExceeds=100
# means any payload over 100 bytes gets gzip-compressed before going
# on the wire. The short-message LG content (<100 bytes) stays plain;
# the long-message LG content (>100 bytes) gets compressed. No
# encryption here — see upstream-airgap-15b-docker.properties for the
# encrypted+compressed variant.
#
# nic/targetIP/bootstrapServers below are placeholders — the
# upstream-a compose service always overrides them via
# AIRGAP_UPSTREAM_NIC=eth0, AIRGAP_UPSTREAM_TARGET_IP=downstream,
# AIRGAP_UPSTREAM_BOOTSTRAP_SERVERS.

id=Upstream_15
nic=lo0

targetIP=kafka-downstream.sitia.nu
targetPort=1234

bootstrapServers=kafka-upstream.sitia.nu:9092,kafka-upstream.sitia.nu:8092
topic=transfer
groupID=15

from=

source=kafka
logLevel=INFO
encryption=false
generateNewSymmetricKeyEvery=50
payloadSize=1500

eps=50

compressWhenLengthExceeds=100

sendingThreads=[{"No-delay": 0}]
