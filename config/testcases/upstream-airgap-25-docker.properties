# Docker chain-run variant of upstream-airgap-25.properties (TC-25:
# SO_RXQ_OVFL kernel drop counter).
#
# source=random (no Kafka in this testcase's data path, same shape as
# TC-22/24). Dropped the committed file's bare-metal-only
# logFileName=/mnt/hgfs/... path (irrelevant inside the container; logs to
