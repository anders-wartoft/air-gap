# Air-gap upstream config for TC-12 chain run — upstream-b side.
#
# Mirror of upstream-airgap-12a-docker.properties with the complementary
# deliverFilter (`2,4,6` → pos=2, i.e. even numbers 2,4,6,… AND Kafka
# offset 0; see posMod in src/filter/filter.go for why offset 0 ends
# up on the even chain). Both upstreams target the SAME downstream
# container at port 1234 (the bare-metal 12b config uses port 1235
# for a second downstream instance; the Docker rig has only one, so
# both chains funnel through it and let the dedup app sort them out).

id=Upstream_12b
nic=lo0

targetIP=kafka-downstream.sitia.nu
targetPort=1234

bootstrapServers=kafka-upstream.sitia.nu:9092,kafka-upstream.sitia.nu:8092
topic=transfer
groupID=12b

from=

source=kafka
logLevel=INFO
encryption=false
generateNewSymmetricKeyEvery=50
payloadSize=1500

eps=50

deliverFilter=2,4,6

# Periodic STATISTICS JSON at INFO level so verify-tc12.sh can read
# the per-chain forwarded count from /tmp/upstream.log — direct proof
# that this chain delivered ~half the load (not just that it consumed).
logStatistics=5

sendingThreads=[{"No-delay": 0}]
