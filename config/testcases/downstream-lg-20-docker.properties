# LG sink for the Docker chain run of TC-20.
#
# The real air-gap downstream (deliberately held back by
# DOWNSTREAM_STARTUP_DELAY, see testcases/20.env) owns TCP:1234 inside the
# network, so we read what it wrote to Kafka once it catches up. TC-20 has
# no dedup profile and a single sendingThread, so each event should appear
# exactly once in kafka-downstream[transfer] despite the late start — that
# is exactly what the testcase is proving (no loss across the "TCP
# connection unavailable" window).
input=kafka
topic=transfer
client-id=downstream-lg-20
bootstrap-server=kafka-downstream.sitia.nu:9092
filter=gap
regex=_(\d+)$
duplicate-detection=true
output=cmd
