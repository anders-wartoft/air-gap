# LG sink for the Docker chain run of TC-1.
#
# The bare-metal procedure in tests/documents/TESTCASES.md uses
# downstream-lg-1.properties (input=udp) — LogGenerator pretends to be the
# air-gap downstream and receives UDP directly. In the Docker test env the
# real air-gap downstream is already running on the shared network and owns
# UDP:1234, so instead we read what the downstream wrote to Kafka.
#
# TC-1 has no dedup profile (dedup is TC-9), so we read the raw `transfer`
# topic. Each event appears twice because upstream has two sendingThreads
# with different consumer-group suffixes.
input=kafka
topic=transfer
client-id=downstream-lg-1
bootstrap-server=kafka-downstream.sitia.nu:9092
filter=gap
regex=_(\d+)$
duplicate-detection=true
output=cmd
