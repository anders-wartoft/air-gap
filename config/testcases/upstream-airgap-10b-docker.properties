# Air-gap upstream config for TC-10 phase 2 (Docker chain run).
#
# Phase 2 of the TC-10 chain run. Same topic (transfer2) as phase 1, but
# fresh groupID so Sarama starts at offset 0 and replays every event the
# phase-1 deliverFilter dropped. No deliverFilter so everything gets
# through; the dedup app absorbs the ~80 duplicates from phase 1 and
# emits only the ~20 previously-missing events to the dedup2 topic.

id=Upstream_10b
nic=lo0

targetIP=127.0.0.1
targetPort=1234

bootstrapServers=kafka-upstream.sitia.nu:9092
topic=transfer2
groupID=test2

from=

source=kafka
logLevel=INFO
encryption=false
generateNewSymmetricKeyEvery=50
payloadSize=1500

# Throttle UDP output — see upstream-airgap-10-docker.properties for
# the rationale. The phase-2 replay is where this matters most: Kafka
# has all 100 events pre-staged, upstream drains them as fast as the
# fetch loop yields them.
eps=50

sendingThreads=[{"No-delay": 0}]

# No deliverFilter in phase 2.
