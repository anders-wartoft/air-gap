# LG sink for the Docker chain run of TC-21. Reads dedup's CLEAN_TOPIC
# ("dedup") rather than the raw "transfer" topic — dedup is what collapses
# the two clusters' streams (and the phase-2 replay duplicates) into one
# deduplicated view, same convention as TC-9/TC-11's LG sinks.
input=kafka
topic=dedup
client-id=downstream-lg-21
bootstrap-server=kafka-downstream:9092
print-keys=true
filter=gap
regex=_(\d+)$
duplicate-detection=true
output=cmd
