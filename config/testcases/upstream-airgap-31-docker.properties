id=Upstream_31
nic=eth0
targetIP=stall
targetPort=1234
transport=tcp
bootstrapServers=kafka:9092
topic=transfer
groupID=tc31
from=
source=kafka
logLevel=INFO
payloadSize=65535
# Three sending threads means three independent consumers, each with its own
# unbounded fetch buffer. This is the "how many does upstream hold in memory at
# once" half of the problem: the per-consumer cost is multiplied by the number
# of consumers, and nothing in this configuration bounds the product.
sendingThreads=[{"t0": 0}, {"t1": 0}, {"t2": 0}]
tcpRetryInterval=100
tcpRetryTimes=0
# Deliberately unsafe mirror of TC-30. Every bound TC-30 sets is removed here:
# a single fetch may pull 96 MiB per partition (TC-30 allows 1 MiB), a record
# may be 100 MiB (TC-30 allows 6 MiB), 64 of them may queue in the consumer
# channel (TC-30 allows 1), and admission is only paused at 100 percent of the
# limit, which the kernel never lets the process reach. The fetch size is the
# decisive one: Sarama decodes a whole fetch response before any of it is
# handed to the consumer. Three consumers can retain more live payload than
# the 192 MiB cgroup permits. Leave room below Sarama's 100 MiB hard response
# ceiling for Kafka record batches and response framing.
# This configuration exists to demonstrate the crash that TC-30's bounded
# configuration prevents.
kafkaFetchDefaultBytes=100663296
kafkaMaxMessageBytes=104857600
kafkaChannelBufferSize=64
memoryLimitBytes=0
memoryHighWatermarkPercent=100
memoryLowWatermarkPercent=99
memoryCheckIntervalMs=100
goMemoryLimitPercent=0
