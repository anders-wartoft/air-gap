# LogGenerator producer for TC-10 (Docker chain run).
#
# Mirrors upstream-lg-10.properties but with the same scale TC-9 uses
# for its chain run (limit=100, eps=100). The committed
# upstream-lg-10.properties sends 1000 events at eps=200 which is fine
# for the bare-metal systemd procedure but, in a Docker chain, overloads
# the UDP burst path: the air-gap upstream doesn't eps-throttle its UDP
# output so it drains 1000 Kafka records into UDP at line rate, and the
# two-phase replay in TC-10 doubles that burst. Observed symptom: one
# or two events get lost in both phases (same loss happens on each
# phase of the same message) which the dedup can't recover.
input=counter
string=TEST_
filter=guard
filter=gap
regex=_(\d+)$
duplicate-detection=true
output=kafka
client-id=test
topic=transfer2
bootstrap-server=kafka-upstream.sitia.nu:9092
eps=100
statistics=true
limit=100
