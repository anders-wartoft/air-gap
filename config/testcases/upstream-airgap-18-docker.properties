# Air-gap upstream config for TC-18 chain run.
#
# TC-18 verifies upstream can load a PASSPHRASE-ENCRYPTED private key
# file (keyFile=....key.enc + keyPasswordFile=....pw) to authenticate
# to Kafka over TLS. No deliverFilter — full delivery (100/100), not
# gap detection; the point here is the encrypted-key load path, same
# as TC-17's full-delivery pattern.
#
# CA note (see TC-17's writeup): kafka-upstream's broker cert is
# signed by airgap-testenv-ca (certs/kafka/ssl/testenv-ca.crt), a
# DIFFERENT CA than kafka-downstream's (MyKafkaCA, certs/tmp/kafka-ca.crt).
# The committed bare-metal upstream-airgap-18.properties uses the WRONG
# one for this Docker rig (certs/tmp/kafka-ca.crt) — fixed here.

id=Upstream_18
nic=lo0

targetIP=kafka-downstream.sitia.nu
targetPort=1234

bootstrapServers=kafka-upstream.sitia.nu:9094,kafka-upstream.sitia.nu:8094
topic=transfer
groupID=18

from=

source=kafka
logLevel=INFO
encryption=false
generateNewSymmetricKeyEvery=50
payloadSize=1500

eps=50

sendingThreads=[{"No-delay": 0}]

# TLS to Kafka with a passphrase-encrypted client key.
certFile=certs/tmp/airgap-upstream.crt
keyFile=certs/tmp/airgap-upstream.key.enc
keyPasswordFile=certs/tmp/airgap-upstream.pw
caFile=certs/kafka/ssl/testenv-ca.crt
