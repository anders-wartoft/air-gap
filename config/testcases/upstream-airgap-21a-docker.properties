# Docker chain-run variant of upstream-airgap-21a.properties (TC-21 phase 1:
# cluster 1, partitions 0-4, deliverFilter opens deliberate gaps).
#
# targetIP/bootstrapServers here are overridden by docker-compose.yml's
# AIRGAP_UPSTREAM_TARGET_IP (defaults to "downstream") /
# AIRGAP_UPSTREAM_BOOTSTRAP_SERVERS (defaults to kafka-upstream:9092,
# kafka-upstream-2:8092 for upstream-a) regardless of what's written below.
id=Upstream_21a
nic=eth0
targetIP=downstream
targetPort=1234
source=kafka
bootstrapServers=kafka-upstream.sitia.nu:9092,kafka-upstream.sitia.nu:8092
topic=transfer
# Phase-1 groupID. Phase 2 (upstream-airgap-21a2-docker.properties) uses a
# different groupID so Kafka replays the whole topic from the start.
groupID=21a-phase1
logLevel=DEBUG
from=
encryption=false
generateNewSymmetricKeyEvery=50
payloadSize=1500
sendingThreads=[{"No-delay": 0}]
# Deliver only offsets 2, 4, 6 — deliberately drops most of this cluster's
# phase-1 stream so the dedup's gap topic shows real gaps in partitions
# 0-4 for phase 2 to close.
deliverFilter=2,4,6
compressWhenLengthExceeds=1200
logStatistics=60
eps=5

# This upstream instance owns partitions 0-4 of the downstream topic; the
# "b" cluster owns 10-14 (partitionStartValue=10) so the two clusters'
# counter IDs never collide after both land in kafka-downstream[transfer].
partitionStartValue=0
