# LG producer for TC-21 chain run, cluster B (kafka-upstream-b). Matches
# the documented manual procedure's "10 logs at 1 EPS" for the second
# cluster; see upstream-lg-21a-docker.properties for the phase-2 re-run
# rationale.
input=counter
string=Cluster2_
filter=guard
filter=gap
regex=_(\d+)$
duplicate-detection=true
output=kafka
client-id=test
topic=transfer
bootstrap-server=kafka-upstream-b:9092
eps=1
statistics=true
limit=10
