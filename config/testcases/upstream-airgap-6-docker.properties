# Air-gap upstream config for TC-6 (Docker chain run).
#
# TC-6 verifies symmetric-key encryption of the UDP payload on top of
# TLS to Kafka. Mirror of upstream-airgap-4-docker.properties plus
#   encryption=true + publicKeyFile=certs/server2.pem
# and a fixed payloadSize (auto-detect is unreliable in containers).
#
# CA note: the kafka-upstream broker keystore is signed by
# airgap-testenv-ca (regenerated by tests/env/generate-kafka-certs.sh).

id=Upstream_6
nic=lo0

targetIP=127.0.0.1
targetPort=1234

bootstrapServers=kafka-upstream.sitia.nu:9094,kafka-upstream.sitia.nu:8094
topic=transfer
groupID=test

from=

source=kafka
logLevel=DEBUG

# UDP payload encryption — symmetric key exchange keyed off the
# downstream's public key.
encryption=true
publicKeyFile=certs/server2.pem
generateNewSymmetricKeyEvery=50

payloadSize=1400

sendingThreads=[{"No-delay": 0}]

# TLS to Kafka
certFile=certs/tmp/airgap-upstream.crt
keyFile=certs/tmp/airgap-upstream.key
caFile=certs/kafka/ssl/testenv-ca.crt
