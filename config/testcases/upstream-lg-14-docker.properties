# LogGenerator producer for TC-14 chain run.
#
# Mirrors upstream-lg-14.properties but at the TC-9/10/12/13 Docker
# scale (limit=100, eps=100) instead of the bare-metal procedure's
# 1000@1000. The upstream deliverFilter=2,4,6 forwards half → 50
# events reach dedup directly, the other 50 become gaps that TC-14's
# create+resend phase is supposed to fill.

input=counter
string=TEST_
filter=guard
filter=gap
regex=_(\d+)$
duplicate-detection=true
output=kafka
client-id=test
topic=transfer
bootstrap-server=kafka-upstream.sitia.nu:9092
eps=100
statistics=true
limit=100
