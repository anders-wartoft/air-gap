# LG sink for the Docker chain run of TC-2.
#
# The bare-metal procedure uses downstream-lg-2.properties (input=udp) —
# LogGenerator pretends to be the air-gap downstream. In the Docker env the
# real air-gap downstream owns UDP:1234 inside the network, so instead we
# read what it wrote to Kafka. TC-2 has no dedup profile, so we read the
# raw `transfer` topic on kafka-downstream. Each event should appear exactly
# once (upstream has one sendingThread; the mid-run restart should resume
# from the committed offset without duplicates).
input=kafka
topic=transfer
client-id=downstream-lg-2
bootstrap-server=kafka-downstream.sitia.nu:9092
filter=gap
regex=_(\d+)$
duplicate-detection=true
output=cmd
