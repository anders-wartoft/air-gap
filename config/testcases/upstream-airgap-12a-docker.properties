# Air-gap upstream config for TC-12 chain run — upstream-a side.
#
# Chain-run divergence from upstream-airgap-12a.properties:
#   * `deliverFilter=1,3,5` makes this chain deliver only Kafka offsets
#     with pos=1 (i.e. odd numbers 1,3,5,… and also 0 is NOT included;
#     Kafka offset 0 maps to pos=2 which belongs to the 12b chain —
#     see the posMod fix in src/filter/filter.go). Pre-fix, both chains
#     silently dropped offset 0 of every partition.
#   * `eps=50` throttle: TokenBucket on the sending thread, matches the
#     TC-9/TC-10 Docker pattern that avoids UDP burst loss.
#   * targetPort=1234 (default) — the downstream listens there.

id=Upstream_12a
nic=lo0

targetIP=kafka-downstream.sitia.nu
targetPort=1234

bootstrapServers=kafka-upstream.sitia.nu:9092,kafka-upstream.sitia.nu:8092
topic=transfer
groupID=12a

from=

source=kafka
logLevel=INFO
encryption=false
generateNewSymmetricKeyEvery=50
payloadSize=1500

eps=50

deliverFilter=1,3,5

# Periodic STATISTICS JSON at INFO level so verify-tc12.sh can read
# the per-chain forwarded count from /tmp/upstream.log — direct proof
# that this chain delivered ~half the load (not just that it consumed).
logStatistics=5

sendingThreads=[{"No-delay": 0}]
