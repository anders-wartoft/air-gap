# Air-gap downstream config for TC-12 chain run.
#
# Mirror of downstream-airgap-12a.properties — already binds UDP on
# 0.0.0.0, has mtu=1500, and translates "transfer" → "transfer-12a" so
# both upstream chains' events land in a single Kafka topic that
# dedup-12-docker.env consumes. Slimmed-down comment block.

id=Downstream_12
nic=lo0

targetIP=0.0.0.0
targetPort=1234

bootstrapServers=kafka-downstream.sitia.nu:9092
internalTopic=airgap-internal

target=kafka
verbose=true
clientId=downstream-12

privateKeyFiles=certs/private*.pem

mtu=1500

# All events arriving on UDP:1234 (from either upstream-12a or
# upstream-12b) go to the same transfer-12a topic, which dedup
# consumes.
topicTranslations={"transfer": "transfer-12a"}
