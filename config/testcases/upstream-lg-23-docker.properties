# LogGenerator producer for TC-23 chain run (inputFilterRules + resend
# respects filters). Same scale as TC-14 (limit=100, eps=100). Upstream's
# deliverFilter=2,4,6 forwards ~50 directly (the other ~50 become gaps for
# create+resend to fill) AND inputFilterRules=deny:10 clears the payload
# (but still sends) for any TEST_N where N contains "10" — see
# upstream-airgap-23-docker.properties.

input=counter
string=TEST_
filter=guard
filter=gap
regex=_(\d+)$
duplicate-detection=true
output=kafka
client-id=test
topic=transfer
bootstrap-server=kafka-upstream.sitia.nu:9092
eps=100
statistics=true
limit=100
