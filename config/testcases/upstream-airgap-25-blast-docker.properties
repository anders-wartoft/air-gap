# TC-25 "blast" variant: eps=-1 ("as fast as possible") to try to
# overwhelm downstream's UDP receive buffer and trigger real kernel-level
# drops, for the positive-control SO_RXQ_OVFL bonus check (see
# tc25-rxqovfl-test.sh). Whether this actually produces a non-zero
# SO_RXQ_OVFL count is host/container-resource-dependent — treated as an
# informational check, not a hard pass/fail requirement (REQ-49's actual
# claim is just that the counter IS EXPOSED when enabled, proven by the
# positive-control check regardless of whether it ever goes non-zero).
#
# logLevel=INFO, not DEBUG: at eps=-1 ("as fast as possible") DEBUG's
# per-packet logging produces millions of log lines in just a few seconds
# — observed 5.6M+ lines for a 14s blast window, which is pure waste (the
# STATISTICS summary this test actually checks prints at INFO regardless)
# and risks ballooning docker's log storage on every chain run. The raw
# UDP throughput that's supposed to overwhelm the kernel buffer doesn't
# depend on how much upstream logs about it.
id=Upstream_25_blast
nic=eth0
targetIP=downstream
targetPort=1234

from=
source=random
encryption=false
logLevel=INFO
eps=-1
logStatistics=10
