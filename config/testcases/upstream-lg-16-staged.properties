# ASCII random payload, about 120-600 bytes including the unique numeric suffix.
input=string
from={string:abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789/{random:118-590}}_{counter:1}
template=continuous
output=kafka
client-id=tc16-generator
topic=tc16-transfer
bootstrap-server=127.0.0.1:29092
# Statistics would inject two transaction-marker records into the data topic.
statistics=false
