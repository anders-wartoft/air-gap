# LogGenerator producer for TC-12 chain run.
#
# Matches TC-9/TC-10 chain-run scale (limit=100, eps=100) rather than
# the committed upstream-lg-12.properties's limit=1000 eps=200, which
# is tuned for the bare-metal procedure. Smaller burst keeps the
# air-gap chain's UDP envelope comfortable; 100 events on one topic
# is enough to prove "two chains + dedup gives 100 unique".
input=counter
string=TEST_
filter=guard
filter=gap
regex=_(\d+)$
duplicate-detection=true
output=kafka
client-id=test
topic=transfer
bootstrap-server=kafka-upstream.sitia.nu:9092,kafka-upstream.sitia.nu:8092
eps=100
statistics=true
limit=100
