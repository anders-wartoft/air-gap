# Resend config for TC-18 chain run — MISSING password (negative test).
#
# Identical to resend-18-docker.properties except keyPasswordFile is
# commented out. The key file IS encrypted, so src/kafka/getkafka.go's
# createTLSConfig() must detect that and fail fast (Logger.Panicf —
# non-zero exit) rather than silently proceeding or hanging. This is
# what tc18-mtls-test.sh asserts as the "negative" case.

bootstrapServers=kafka-upstream.sitia.nu:9094,kafka-upstream.sitia.nu:8094
topic=transfer
groupID=resend
logLevel=DEBUG
nic=lo0
targetIP=kafka-downstream.sitia.nu
targetPort=1234
payloadSize=auto
eps=200

# TLS to Kafka — key IS encrypted but NO password file given on purpose.
certFile=certs/tmp/airgap-upstream.crt
keyFile=certs/tmp/airgap-upstream.key.enc
#keyPasswordFile=certs/tmp/airgap-upstream.pw
caFile=certs/kafka/ssl/testenv-ca.crt
