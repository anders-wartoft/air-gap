# Managed configuration, including disabled settings containing equals signs.
  # eps=not-a-number
# privateKeyFiles=
id=tcp#1  # Embedded hash remains part of the instance ID.
nic=eth0
targetIP=downstream
targetPort=1234 # Destination port.
source=random
eps=5	# Events per second.
encryption=false
payloadSize=1400
logLevel=INFO
logFileName=/airgap/work/upstream.log # Also exercises signing-config reread.
transport=tcp
tcpTLSEnabled=true
tcpTLSAuthMode=pinned # Strict reload parser.
tcpTLSCertFile=/airgap/work/client-1.crt # Client identity.
tcpTLSKeyFile=/airgap/work/client-1.key
tcpTLSTrustedKeysDir=/airgap/work/server-trust
