# Resend config for TC-18 chain run — CORRECT password (positive test).
#
# Mirrors resend-18.properties but with the CA fix: resend reads from
# kafka-upstream (signed by airgap-testenv-ca), not kafka-downstream
# (MyKafkaCA) — the committed file uses the wrong CA for this Docker
# rig's kafka-upstream cluster. nic/targetIP/bootstrapServers below are
# placeholders — the resend compose service always overrides them via
# AIRGAP_RESEND_NIC=eth0, AIRGAP_RESEND_TARGET_IP=downstream,
# AIRGAP_RESEND_BOOTSTRAP_SERVERS (set via RESEND_BOOTSTRAP in the
# manifest/script, same gotcha as TC-17).

bootstrapServers=kafka-upstream.sitia.nu:9094,kafka-upstream.sitia.nu:8094
topic=transfer
groupID=resend
logLevel=DEBUG
nic=lo0
targetIP=kafka-downstream.sitia.nu
targetPort=1234
payloadSize=auto
eps=200

# TLS to Kafka with a passphrase-encrypted client key — CORRECT password.
certFile=certs/tmp/airgap-upstream.crt
keyFile=certs/tmp/airgap-upstream.key.enc
keyPasswordFile=certs/tmp/airgap-upstream.pw
caFile=certs/kafka/ssl/testenv-ca.crt
