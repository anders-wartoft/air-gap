# Air-gap upstream config for TC-23 chain run (inputFilterRules + resend
# respects filters).
#
# Two INDEPENDENT filtering mechanisms are deliberately both active here:
#   - deliverFilter=2,4,6 (same as TC-14): delivers only even-numbered
#     offsets, creating REAL gaps for the odd ones — this is what
#     create/resend closes, same mechanism as TC-14.
#   - inputFilterRules=deny:10 (the committed bare-metal file had this
#     commented out — dead code that never actually ran the test it
#     claims to; enabled here): denies any payload CONTAINING the
#     substring "10" (TEST_10, TEST_100-109, TEST_110-119, ...). Per
#     src/upstream/upstream.go, a denied message is NOT dropped — its
#     payload is cleared to empty but still sent, so the gap detector
#     sees the offset as present (REQ-38: filtered != missing).
#
# nic/targetIP/bootstrapServers below are placeholders, same as every
# other upstream-a docker config — overridden by docker-compose.yml's
# AIRGAP_UPSTREAM_NIC/_TARGET_IP/_BOOTSTRAP_SERVERS regardless.

id=Upstream_23
nic=eth0

targetIP=downstream
targetPort=1234

bootstrapServers=kafka-upstream.sitia.nu:9092,kafka-upstream.sitia.nu:8092
topic=transfer
groupID=23

from=

source=kafka
logLevel=DEBUG
encryption=false
generateNewSymmetricKeyEvery=50
payloadSize=1500

eps=50

deliverFilter=2,4,6

inputFilterRules=deny:10
inputFilterDefaultAction=allow

sendingThreads=[{"No-delay": 0}]
