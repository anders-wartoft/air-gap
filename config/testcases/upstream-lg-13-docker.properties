# LogGenerator producer for TC-13 chain run.
#
# Mirrors upstream-lg-13.properties but at the TC-9/10/12 Docker scale
# (limit=100, eps=100) instead of the bare-metal procedure's 1000@200.
# The upstream deliverFilter=2,4,6 forwards half → 50 events reach the
# dedup, 50 become MISSING counters (which is the whole point of TC-13).

input=counter
string=TEST_
filter=guard
filter=gap
regex=_(\d+)$
duplicate-detection=true
output=kafka
client-id=test
topic=transfer
bootstrap-server=kafka-upstream.sitia.nu:9092
eps=100
statistics=true
limit=100
