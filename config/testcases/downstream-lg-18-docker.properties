# LogGenerator sink for TC-18 chain run.
#
# No dedup — reads straight from kafka-downstream[transfer] (no topic
# translation configured in downstream-airgap-18-docker.properties).
# PLAINTEXT, same reasoning as the producer side.

input=kafka
topic=transfer
client-id=downstream-18
bootstrap-server=kafka-downstream.sitia.nu:9092
filter=gap
regex=_(\d+)$
duplicate-detection=true
output=cmd
