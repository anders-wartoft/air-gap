# Docker chain-run variant of upstream-airgap-20.properties (TC-20: TCP
# transport, "downstream starts late" recovery).
#
# Differences from the bare-metal file:
#   - groupID fixed to 20 (the committed file had a stale "19" left over
#     from a copy/paste of the TC-19 config).
#   - dropped the TC-19 inputFilterRules block entirely — TC-20 has nothing
#     to do with input filtering, that was leftover cruft from the same
#     copy/paste, pointing at a bare-metal-only /mnt/hgfs path that
#     wouldn't resolve inside the container anyway.
#   - targetIP/bootstrapServers here are overridden by docker-compose.yml's
#     AIRGAP_UPSTREAM_TARGET_IP (defaults to the "downstream" service
#     hostname) / AIRGAP_UPSTREAM_BOOTSTRAP_SERVERS regardless of what's
#     written below; left as the plaintext Kafka broker aliases for anyone
#     reading the file directly.
id=Upstream_20
nic=eth0
targetIP=downstream
targetPort=1234
source=kafka
bootstrapServers=kafka-upstream.sitia.nu:9092,kafka-upstream.sitia.nu:8092
topic=transfer
groupID=20
logLevel=DEBUG
from=
encryption=false
generateNewSymmetricKeyEvery=50
payloadSize=1500
sendingThreads=[{"No-delay": 0}]
compressWhenLengthExceeds=1200
logStatistics=60
eps=500

# TCP transport: this is the behaviour under test.
#
# tcpRetryTimes is finite (not the 0/infinite default) so the status
# machinery in upstream.go actually transitions: with infinite retries the
# in-process retry loop blocks on the SAME message forever and never marks
# transportStatus as anything other than "running" (verified against
# src/upstream/upstream.go — the "Transport status changed to error" /
# "...restored to running" lines are only reachable once a retry budget is
# actually exhausted), so the documented
#   [INFO] Transport status restored to running (was: ...)
# recovery line would never appear. With a bounded retry count, each
# give-up cycle marks the message as not-consumed (explicit comment in
# upstream.go: "will be reprocessed when the receiver comes back up"), so
# Kafka redelivers it next poll — still zero data loss, but now the
# unavailable -> error -> restored transition is genuinely observable,
# matching TESTCASES.md's documented procedure.
tcpRetryTimes=3
tcpRetryInterval=1000
transport=tcp
