# Air-gap upstream config for TC-19 chain run.
#
# inputFilterRules path fixed to the Docker config mount
# (/airgap/config/..., not the bare-metal /mnt/hgfs/... path). The rule
# file itself (upstream-airgap-filter-19.txt) is reused as-is — it's
# already under config/testcases/ which is mounted read-only at
# /airgap/config in every service.
#
# logStatistics=5 (vs. the committed 60) so tc19-inputfilter-test.sh
# can observe a STATISTICS line with total_filtered/total_unfiltered
# shortly after sending the test payloads, inside the chain's short
# runtime. No deliverFilter — full delivery, the point here is input
# filtering, not gap detection.

id=Upstream_19
nic=lo0

targetIP=kafka-downstream.sitia.nu
targetPort=1234

bootstrapServers=kafka-upstream.sitia.nu:9092,kafka-upstream.sitia.nu:8092
topic=transfer
groupID=19

from=

source=kafka
logLevel=INFO
encryption=false
generateNewSymmetricKeyEvery=50
payloadSize=1500

eps=50

sendingThreads=[{"No-delay": 0}]

logStatistics=5

inputFilterRules=/airgap/config/testcases/upstream-airgap-filter-19.txt
inputFilterDefaultAction=allow
