# Air-gap downstream config for TC-18 chain run.
#
# Mirrors upstream-airgap-18-docker.properties's encrypted-key setup.
# No topic translation — transfer stays transfer on kafka-downstream.
#
# CA note: kafka-downstream's broker cert is signed by MyKafkaCA
# (certs/tmp/kafka-ca.crt), unlike kafka-upstream — see TC-17's
# writeup and upstream-airgap-18-docker.properties's comment.

id=Downstream_18
nic=lo0

targetIP=0.0.0.0
targetPort=1234

bootstrapServers=kafka-downstream.sitia.nu:9094,kafka-downstream.sitia.nu:8094
internalTopic=airgap-internal

target=kafka
logLevel=INFO
clientId=downstream-18

privateKeyFiles=certs/private*.pem

mtu=1500

# TLS to Kafka with a passphrase-encrypted client key.
certFile=certs/tmp/airgap-downstream.crt
keyFile=certs/tmp/airgap-downstream.key.enc
keyPasswordFile=certs/tmp/airgap-downstream.pw
caFile=certs/tmp/kafka-ca.crt
