# Docker chain-run variant of upstream-airgap-21a2.properties (TC-21 phase
# 2: cluster 1 restarted with NO deliverFilter + a fresh groupID so Kafka
# replays the whole topic from the start, closing the gaps phase 1 opened
# intentionally).
#
# targetIP/bootstrapServers overridden by docker-compose.yml the same way
# as the phase-1 file; see upstream-airgap-21a-docker.properties.
id=Upstream_21a
nic=eth0
targetIP=downstream
targetPort=1234
source=kafka
bootstrapServers=kafka-upstream.sitia.nu:9092,kafka-upstream.sitia.nu:8092
topic=transfer
# Fresh groupID (not "21a-phase1") so this consumer has no committed
# offset and starts from the earliest record, replaying everything —
# including what phase 1's deliverFilter dropped.
groupID=21a-phase2
logLevel=DEBUG
from=
encryption=false
generateNewSymmetricKeyEvery=50
payloadSize=1500
sendingThreads=[{"No-delay": 0}]
# No deliverFilter: deliver everything this time.
compressWhenLengthExceeds=1200
logStatistics=60
eps=5

partitionStartValue=0
