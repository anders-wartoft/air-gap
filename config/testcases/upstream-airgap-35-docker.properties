id=Upstream_35
nic=eth0
targetIP=downstream
targetPort=1234
transport=udp
bootstrapServers=kafka:9092
topic=source
groupID=tc35
from=
source=kafka
logLevel=INFO
logStatistics=0
payloadSize=1200
sendingThreads=[{"Rotate": 0}]
topicTranslations={"source":"transfer"}

# TC-35 rotates this file and reloads with SIGHUP, as logrotate does. The
# Kafka consumer assignment records use the application logger, so the rotated
# file must stop receiving them after reload.
logFileName=/var/log/airgap/upstream.log
