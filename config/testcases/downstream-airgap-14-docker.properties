# Air-gap downstream config for TC-14 chain run.
#
# No topic translation — the chain reads `transfer` from kafka-upstream,
# air-gap forwards it to kafka-downstream as `transfer`, and dedup
# (dedup-14-docker.env) consumes RAW_TOPICS=transfer. Mirrors
# downstream-airgap-13-docker.properties.

id=Downstream_14
nic=lo0

targetIP=0.0.0.0
targetPort=1234

bootstrapServers=kafka-downstream.sitia.nu:9092
internalTopic=airgap-internal

target=kafka
logLevel=INFO
clientId=downstream-14

privateKeyFiles=certs/private*.pem

mtu=1500
