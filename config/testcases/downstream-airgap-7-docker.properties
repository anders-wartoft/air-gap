# Air-gap downstream config for TC-7 (Docker chain run).
#
# Identical to downstream-airgap-7.properties except:
#   - targetIP=0.0.0.0 so UDP from upstream-a across the Docker bridge
#     actually reaches us (the stock 127.0.0.1 would silently drop them).

id=Downstream_7
nic=lo0

targetIP=0.0.0.0
targetPort=1234

bootstrapServers=kafka-downstream.sitia.nu:9092
internalTopic=airgap-internal

target=kafka
verbose=true
clientId=downstream-7

privateKeyFiles=certs/private*.pem

mtu=1500
