# Air-gap downstream config for TC-2 (Docker chain run).
#
# Mirrors downstream-airgap-1.properties: listen on 0.0.0.0 so UDP from the
# upstream-a container reaches us, and write decoded events to Kafka
# (target=kafka) so the LG sink can read kafka-downstream[transfer] and
# verify that no logs were lost across the mid-run upstream restart.

id=Downstream_2
nic=lo0

targetIP=0.0.0.0
targetPort=1234

bootstrapServers=kafka-downstream.sitia.nu:9092
internalTopic=airgap-internal

target=kafka
verbose=true
clientId=downstream-2

privateKeyFiles=certs/private*.pem

mtu=1500
