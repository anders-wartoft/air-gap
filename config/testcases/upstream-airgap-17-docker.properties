# Air-gap upstream config for TC-17 chain run.
#
# TC-17 verifies dedup's OWN TLS connection to Kafka; the upstream/
# downstream TLS-to-Kafka path is already covered by TC-6 and just
# reused here to run the whole chain over the SSL listener (so
# kafka-downstream[transfer] — what dedup reads — is populated the
# same way the bare-metal procedure does it).
#
# Mirrors upstream-airgap-6-docker.properties's TLS config but WITHOUT
# UDP payload encryption (encryption=false) — TC-17 is about Kafka TLS,
# not air-gap's own symmetric-key encryption (that's TC-6's job).
# No deliverFilter: TC-17 expects full delivery (100/100), not gaps.

id=Upstream_17
nic=lo0

targetIP=kafka-downstream.sitia.nu
targetPort=1234

bootstrapServers=kafka-upstream.sitia.nu:9094,kafka-upstream.sitia.nu:8094
topic=transfer
groupID=17

from=

source=kafka
logLevel=INFO
encryption=false
generateNewSymmetricKeyEvery=50
payloadSize=1500

eps=50

sendingThreads=[{"No-delay": 0}]

# TLS to Kafka — kafka-upstream broker cert is signed by the
# airgap-testenv-ca CA at certs/kafka/ssl/testenv-ca.crt. NOTE: this is
# a DIFFERENT CA than what kafka-downstream's broker cert uses (MyKafkaCA,
# at certs/tmp/kafka-ca.crt — see downstream-airgap-17-docker.properties)
# — a pre-existing asymmetry in this test env's cert generation history
# (upstream's broker cert was regenerated more recently than
# downstream's). dedup's truststore (kafka-trust.jks) contains BOTH
# CAs, which is why only dedup can use a single combined truststore
# while the Go upstream/downstream binaries each need their own
# matching single CA file.
certFile=certs/tmp/airgap-upstream.crt
keyFile=certs/tmp/airgap-upstream.key
caFile=certs/kafka/ssl/testenv-ca.crt
