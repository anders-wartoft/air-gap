# Docker chain-run variant of downstream-tcp.properties (TC-22: TCP
# transport, downstream restart without loss).
#
# target=cmd: just prints "Random message N" to stdout (docker logs) —
# no Kafka in this testcase's data path at all. The whole point of TC-22
# is proving upstream buffers/retries correctly while THIS container is
# stopped and restarted mid-run (see DOWNSTREAM_RESTART_AT_SECONDS in
# testcases/22.env), so its own log is the only source of truth; verify-
# tc22.sh checks it directly.
id=Downstream_22
nic=eth0

targetIP=0.0.0.0
targetPort=1234

target=cmd
logLevel=DEBUG
numReceivers=10

privateKeyFiles=certs/private*.pem

mtu=1500
transport=tcp
