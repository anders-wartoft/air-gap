# LG sink for the Docker chain run of TC-6.
#
# Bare-metal TC-6 uses tcpdump + a Kafka console consumer to prove the UDP
# payload is encrypted on the wire while plaintext still reaches the
# downstream Kafka cluster. For the automated chain we just need an
# end-to-end counter check: read the decrypted events from
# kafka-downstream[transfer] (over plaintext — the TLS/encryption hops are
# upstream↔Kafka, downstream↔Kafka, and UDP↔UDP, not LG↔Kafka).
input=kafka
topic=transfer
client-id=downstream-lg-6
bootstrap-server=kafka-downstream.sitia.nu:9092
filter=gap
regex=_(\d+)$
duplicate-detection=true
output=cmd
