# `resend` config for TC-23 chain run. Reads the gap bundle `create`
# exported, pulls the original payloads from kafka-upstream[transfer] by
# offset, and re-sends them via UDP to downstream — same shape as
# resend-14.properties, PLUS inputFilterRules=deny:10 (the committed
# bare-metal file had this commented out too).
#
# This is TC-23's actual NEW claim over TC-14 (REQ-39): resend must apply
# the SAME input filter rules as a real upstream would. Per
# src/resend/resend.go, a denied gap entry is still sent (so the gap
# still closes / dedup still sees the offset as filled) but with its
# payload cleared to empty — so content that was filtered the first time
# around (because it matched the deny rule) stays filtered even when
# resent, rather than being resurrected in full via the gap-fill path.
#
# bootstrapServers overridden by docker-compose.yml's RESEND_BOOTSTRAP
# (defaults to plaintext kafka-upstream:9092,kafka-upstream-2:8092)
# regardless of what's written below; targetIP overridden by
# AIRGAP_RESEND_TARGET_IP (defaults to "downstream").
bootstrapServers=kafka-upstream.sitia.nu:9092,kafka-upstream.sitia.nu:8092
topic=transfer
groupID=resend-23
logLevel=DEBUG
targetIP=downstream
targetPort=1234
payloadSize=auto
resendFileName=./tmp/create-23-results-first.json
eps=200

inputFilterRules=deny:10
inputFilterDefaultAction=allow
