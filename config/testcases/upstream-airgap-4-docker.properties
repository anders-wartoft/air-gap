# Air-gap upstream config for TC-4 (Docker chain run).
#
# TC-4 verifies TLS to the Kafka brokers (REQ-7b etc.). The repo-shipped
# upstream-airgap-4.properties references certs/tmp/kafka-ca.crt, but the
# brokers in the Docker test env advertise server certs signed by
# certs/kafka/ssl/testenv-ca.crt (produced by tests/env/generate-kafka-certs.sh).
# This file is identical except that it points caFile at the test-env CA.
#
# Note: brokers run KAFKA_SSL_CLIENT_AUTH=none (no mTLS); certFile/keyFile
# are therefore not strictly required. We keep them so the config matches
# the bare-metal TC-4 shape and so a future mTLS flip just works.

id=Upstream_4
nic=lo0

targetIP=127.0.0.1
targetPort=1234

bootstrapServers=kafka-upstream.sitia.nu:9094,kafka-upstream.sitia.nu:8094
topic=transfer
groupID=test

from=

source=kafka
logLevel=DEBUG
generateNewSymmetricKeyEvery=50
payloadSize=0
logStatistics=30

sendingThreads=[{"No-delay": 0}]

# TLS to Kafka — Docker env CA
certFile=certs/tmp/airgap-upstream.crt
keyFile=certs/tmp/airgap-upstream.key
caFile=certs/kafka/ssl/testenv-ca.crt
