# TLS/mTLS upstream config for TC-24 chain run — "client B" (second
# concurrent mTLS client for Part B's two-clients test, CN
# nu.sitia.airgap.upstream-2). Reads certs directly from the read-only
# /airgap/certs mount — unlike client A, this one is never rotated.

id=Upstream_24b
nic=eth0
targetIP=downstream
targetPort=1234

from=
source=random
generateNewSymmetricKeyEvery=50
payloadSize=1500
logLevel=DEBUG
eps=3

transport=tcp
tcpTLSEnabled=true
tcpTLSCertFile=/airgap/certs/upstream2.crt
tcpTLSKeyFile=/airgap/certs/upstream2.key
tcpTLSKeyPasswordFile=/airgap/certs/upstream2.key.pw
tcpTLSCAFile=/airgap/certs/ca.crt
tcpTLSServerCNRegex=^nu\.sitia\.airgap\.downstream-[0-9]+$
tcpTLSCipherSuites=TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384,TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384

tcpRetryInterval=1000
tcpRetryTimes=0
tcpRetryErrorLevel=WARN
