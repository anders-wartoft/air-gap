# LG sink for the Docker chain run of TC-4.
#
# The bare-metal procedure reads result.txt offline. In the Docker chain
# we read what the air-gap downstream wrote to kafka-downstream[transfer]
# over PLAINTEXT (9092) — the SSL hop under test is upstream↔Kafka, not
# the LG↔Kafka hop.
input=kafka
topic=transfer
client-id=downstream-lg-4
bootstrap-server=kafka-downstream.sitia.nu:9092
filter=gap
regex=_(\d+)$
duplicate-detection=true
output=cmd
