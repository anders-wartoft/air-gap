# LG sink for the Docker chain run of TC-23. Reads dedup's CLEAN_TOPIC,
# same convention as TC-14.
#
# CAVEAT (why this sink's own gap/duplicate counters are informational
# only here, not authoritative — verify-tc23.sh is the real pass/fail):
# input-filtered messages arrive with an EMPTY Kafka value (payload
# cleared, see upstream-airgap-23-docker.properties) but a non-empty KEY
# (the "transfer_<partition>_<offset>" id dedup preserves). The regex
# `_(\d+)$` is anchored to the END of the full "KEY: VALUE" line, so for a
# normal (non-filtered) message it correctly matches the VALUE's trailing
# TEST_N counter — but for a filtered (empty-VALUE) message there's
# nothing after "KEY: " to match against the VALUE, so it falls back to
# matching the KEY's own trailing offset digits instead. That's a
# different, unrelated number sequence (Kafka offsets, not TEST_N), which
# this sink's own gap detector has no way to distinguish — it isn't built
# to understand "this one's expected to look like a gap". Real
# verification of REQ-38/REQ-39 is dedup's own MISSING-REPORT counters
# (filtered-but-sent events should never show as gaps there) plus a
# direct kafka-console-consumer scrape of the clean topic for leaked
# "10"-containing content — see verify-tc23.sh.
input=kafka
topic=dedup
client-id=downstream-lg-23
bootstrap-server=kafka-downstream.sitia.nu:9092
print-keys=true
filter=gap
regex=_(\d+)$
duplicate-detection=true
output=cmd
