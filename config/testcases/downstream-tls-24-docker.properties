# TLS/mTLS downstream config for TC-24 chain run — default (CN-required)
# mode, used for Part B (two concurrent mTLS clients + cleartext-rejection
# probe) and Part D (live SIGHUP cert rotation).
#
# tcpTLSClientCNRegex matches BOTH upstream-1 and upstream-2 (Part B needs
# both to authenticate concurrently).

id=Downstream_24
nic=eth0
targetIP=0.0.0.0
targetPort=1234

target=cmd
logLevel=DEBUG
numReceivers=10
privateKeyFiles=certs/private*.pem
mtu=1500

transport=tcp
tcpTLSEnabled=true
tcpTLSCAFile=/airgap/certs/ca.crt
tcpTLSCertFile=/airgap/certs/downstream.crt
tcpTLSKeyFile=/airgap/certs/downstream.key
tcpTLSKeyPasswordFile=/airgap/certs/downstream.key.pw
tcpTLSClientAuth=require
tcpTLSClientCNRegex=^nu\.sitia\.airgap\.upstream-[0-9]+$
tcpTLSCipherSuites=TLS1.3
