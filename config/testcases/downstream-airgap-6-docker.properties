# Air-gap downstream config for TC-6 (Docker chain run).
#
# Pair of upstream-airgap-6-docker.properties — decrypts UDP payloads and
# writes plaintext events to kafka-downstream[transfer] over TLS.
#
# Docker-specific:
#   - targetIP=0.0.0.0 so UDP from upstream-a reaches us across the Docker
#     bridge.
#   - mtu fixed at 1500 (generic bridge MTU).
#   - caFile=certs/tmp/kafka-ca.crt because the shipped
#     kafka-downstream.keystore.jks is signed by MyKafkaCA (see TC-4 note).

id=Downstream_6
nic=lo0

targetIP=0.0.0.0
targetPort=1234

bootstrapServers=kafka-downstream.sitia.nu:9094,kafka-downstream.sitia.nu:8094
internalTopic=airgap-internal

target=kafka
verbose=true
clientId=downstream-6

logLevel=DEBUG

# Private keys that decrypt the symmetric-key handshake from upstream.
privateKeyFiles=certs/private*.pem

mtu=1500

# TLS to Kafka — kafka-downstream broker cert is signed by MyKafkaCA
certFile=certs/tmp/airgap-downstream.crt
keyFile=certs/tmp/airgap-downstream.key
caFile=certs/tmp/kafka-ca.crt
