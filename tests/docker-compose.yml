name: ${COMPOSE_PROJECT_NAME:-airgap-package-tests}

# Simple Docker Compose for testing air-gap packages
# Usage: docker-compose up -d
#        docker-compose exec rocky bash
#        docker-compose down

services:
  # Rocky Linux 9 - Test RPM packages
  rocky:
    image: ${ROCKY_IMAGE:-docker.io/library/rockylinux:9}
    volumes:
      - ../target/dist:/packages:ro
      - ./scripts:/scripts:ro
    command: tail -f /dev/null

  # Ubuntu 22.04 - Test DEB packages
  ubuntu:
    image: ${UBUNTU_IMAGE:-docker.io/library/ubuntu:22.04}
    volumes:
      - ../target/dist:/packages:ro
      - ./scripts:/scripts:ro
    environment:
      DEBIAN_FRONTEND: noninteractive
    command: tail -f /dev/null

  # Alpine 3.18 - Test APK packages
  alpine:
    image: ${ALPINE_IMAGE:-docker.io/library/alpine:3.18}
    volumes:
      - ../target/dist:/packages:ro
      - ./scripts:/scripts:ro
    command: tail -f /dev/null
