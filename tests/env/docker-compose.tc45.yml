services:
  upstream:
    platform: linux/amd64
    volumes:
      - ${TC_WORK}:/airgap/work:z
    entrypoint: ["/airgap/work/${TC45_UPSTREAM:-modern}/upstream"]
    command: ["/airgap/work/upstream.properties"]
    restart: "no"

  downstream:
    platform: linux/amd64
    volumes:
      - ${TC_WORK}:/airgap/work:z
    entrypoint: ["/airgap/work/${TC45_DOWNSTREAM:-modern}/downstream"]
    command: ["/airgap/work/downstream.properties"]
    restart: "no"

  fixture:
    platform: linux/amd64
    build:
      context: .
      args:
        BASE_IMAGE: ${DOWNSTREAM_BASE_IMAGE:-docker.io/library/rockylinux:9}
    image: localhost/${COMPOSE_PROJECT_NAME:-airgap-testenv}-downstream:local
    pull_policy: build
    volumes:
      - ${TC_WORK}:/airgap/work:z
    entrypoint: ["/airgap/work/fixture"]
