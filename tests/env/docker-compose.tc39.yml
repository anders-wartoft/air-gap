services:
  downstream:
    platform: linux/amd64
    build:
      context: .
      args:
        BASE_IMAGE: ${DOWNSTREAM_BASE_IMAGE:-docker.io/library/rockylinux:9}
    image: localhost/airgap-testenv-tc39:local
    volumes:
      - ${TC39_WORK:?Run through run-testcase.sh 39}:/airgap/work:z
    entrypoint: ["/airgap/work/downstream"]
    command: ["/airgap/work/downstream.properties"]
    environment:
      AIRGAP_LOG_REPEAT_INTERVAL: "0"
    restart: "no"

  upstream:
    platform: linux/amd64
    image: localhost/airgap-testenv-tc39:local
    volumes:
      - ${TC39_WORK}:/airgap/work:z
    entrypoint: ["/airgap/work/upstream"]
    command: ["/airgap/work/upstream.properties"]
    environment:
      AIRGAP_LOG_REPEAT_INTERVAL: "0"
    restart: "no"
