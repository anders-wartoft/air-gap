services:
  kafka:
    image: ${KAFKA_IMAGE:-docker.io/confluentinc/confluent-local:7.6.1}
    hostname: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server kafka:9092 --list >/dev/null 2>&1"]
      interval: 2s
      timeout: 2s
      retries: 60

  topic-init:
    image: ${KAFKA_IMAGE:-docker.io/confluentinc/confluent-local:7.6.1}
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - bash
      - -ec
      - >-
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic source --partitions 1 &&
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic transfer --partitions 1 &&
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic airgap-internal --partitions 1

  downstream:
    build:
      context: .
      args:
        BASE_IMAGE: ${DOWNSTREAM_BASE_IMAGE:-docker.io/library/rockylinux:9}
    image: localhost/airgap-testenv-kafka-transfer:local
    hostname: downstream
    depends_on:
      topic-init:
        condition: service_completed_successfully
    volumes:
      - ${AIRGAP_BIN_DIR:-../../target/linux-amd64}:/airgap/bin:ro,z
      - ../../config/testcases:/airgap/config:ro,z
    environment:
      AIRGAP_CONFIG: /airgap/config/downstream.properties
    command: ["downstream"]
    restart: on-failure:3

  upstream:
    image: localhost/airgap-testenv-kafka-transfer:local
    hostname: upstream
    depends_on:
      topic-init:
        condition: service_completed_successfully
      downstream:
        condition: service_started
    volumes:
      - ${AIRGAP_BIN_DIR:-../../target/linux-amd64}:/airgap/bin:ro,z
      - ../../config/testcases:/airgap/config:ro,z
    environment:
      AIRGAP_CONFIG: /airgap/config/upstream.properties
    command: ["upstream"]
    restart: on-failure:3

  producer:
    image: localhost/airgap-testenv-kafka-transfer:local
    entrypoint: ["/airgap/work/airgap-load"]
    command: ["produce", "--brokers=kafka:9092", "--topic=source", "--count=8", "--size=1024"]
    depends_on:
      topic-init:
        condition: service_completed_successfully
    volumes:
      - ${TC_WORK:?TC_WORK is required}:/airgap/work:ro,z
