services:
  systemd:
    build:
      context: ../..
      dockerfile: tests/env/Dockerfile.tc8-systemd
    privileged: true
    cgroup: private
    environment:
      container: docker
    tmpfs:
      - /run
      - /run/lock
      - /tmp
    volumes:
      - ${AIRGAP_BIN_DIR:-../../target/linux-amd64}:/airgap/bin:ro,z
