services:
  downstream:
    volumes:
      - downstream-logs:/var/log/airgap
    environment:
      AIRGAP_CONFIG: /airgap/config/downstream-airgap-35-docker.properties

  upstream:
    volumes:
      - upstream-logs:/var/log/airgap
    environment:
      AIRGAP_CONFIG: /airgap/config/upstream-airgap-35-docker.properties

  upstream-b:
    build:
      context: .
      args:
        BASE_IMAGE: ${UPSTREAM_BASE_IMAGE:-docker.io/library/rockylinux:9}
    image: localhost/${COMPOSE_PROJECT_NAME:-airgap-testenv}-upstream:local
    pull_policy: build
    hostname: upstream-b
    profiles: ["rebalance"]
    depends_on:
      topic-init:
        condition: service_completed_successfully
    volumes:
      - ${AIRGAP_BIN_DIR:-../../target/linux-amd64}:/airgap/bin:ro,z
      - ../../config/testcases:/airgap/config:ro,z
      - upstream-b-logs:/var/log/airgap
    environment:
      AIRGAP_CONFIG: /airgap/config/upstream-airgap-35b-docker.properties
    command: ["upstream"]
    restart: "no"

  # Negative control. Runs a binary built with the non-default
  # airgap_logrotate_leak tag, which keeps the replaced descriptor open.
  downstream-leak:
    build:
      context: .
      args:
        BASE_IMAGE: ${DOWNSTREAM_BASE_IMAGE:-docker.io/library/rockylinux:9}
    image: localhost/${COMPOSE_PROJECT_NAME:-airgap-testenv}-downstream:local
    pull_policy: build
    hostname: downstream-leak
    profiles: ["leak-control"]
    depends_on:
      topic-init:
        condition: service_completed_successfully
    volumes:
      - ${TC35_LEAK_BIN:?TC35_LEAK_BIN is required}:/airgap/bin:ro,z
      - ../../config/testcases:/airgap/config:ro,z
      - downstream-leak-logs:/var/log/airgap
    environment:
      AIRGAP_CONFIG: /airgap/config/downstream-airgap-35-docker.properties
    command: ["downstream"]
    restart: "no"

volumes:
  upstream-logs:
  upstream-b-logs:
  downstream-logs:
  downstream-leak-logs:
