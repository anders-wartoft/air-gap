services:
  upstream-a:
    build:
      context: .
      args:
        BASE_IMAGE: ${UPSTREAM_BASE_IMAGE:-rockylinux:9}
    image: airgap-testenv-tc26-upstream:local
    volumes:
      - ${AIRGAP_BIN_DIR:-../../target/linux-amd64}:/airgap/bin:ro
      - ../../config/testcases:/airgap/config:ro
    environment:
      AIRGAP_CONFIG: /airgap/config/upstream-warnings-26-docker.properties
      AIRGAP_UPSTREAM_LOG_LEVEL: ${TC26_LOG_LEVEL:-DEBUG}
    command: ["upstream"]

  downstream:
    build:
      context: .
      args:
        BASE_IMAGE: ${DOWNSTREAM_BASE_IMAGE:-rockylinux:9}
    image: airgap-testenv-tc26-downstream:local
    volumes:
      - ${AIRGAP_BIN_DIR:-../../target/linux-amd64}:/airgap/bin:ro
      - ../../config/testcases:/airgap/config:ro
    environment:
      AIRGAP_CONFIG: /airgap/config/downstream-warnings-26-docker.properties
      AIRGAP_DOWNSTREAM_LOG_LEVEL: ${TC26_LOG_LEVEL:-DEBUG}
    command: ["downstream"]
