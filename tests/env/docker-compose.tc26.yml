services:
  upstream-a:
    build:
      context: .
      args:
        BASE_IMAGE: ${UPSTREAM_BASE_IMAGE:-docker.io/library/rockylinux:9}
    image: localhost/${COMPOSE_PROJECT_NAME:-airgap-testenv}-upstream:local
    pull_policy: build
    volumes:
      - ${AIRGAP_BIN_DIR:-../../target/linux-amd64}:/airgap/bin:ro,z
      - ../../config/testcases:/airgap/config:ro,z
    environment:
      AIRGAP_CONFIG: /airgap/config/upstream-warnings-26-docker.properties
      AIRGAP_UPSTREAM_LOG_LEVEL: ${TC26_LOG_LEVEL:-DEBUG}
    command: ["upstream"]

  downstream:
    build:
      context: .
      args:
        BASE_IMAGE: ${DOWNSTREAM_BASE_IMAGE:-docker.io/library/rockylinux:9}
    image: localhost/${COMPOSE_PROJECT_NAME:-airgap-testenv}-downstream:local
    pull_policy: build
    volumes:
      - ${AIRGAP_BIN_DIR:-../../target/linux-amd64}:/airgap/bin:ro,z
      - ../../config/testcases:/airgap/config:ro,z
    environment:
      AIRGAP_CONFIG: /airgap/config/downstream-warnings-26-docker.properties
      AIRGAP_DOWNSTREAM_LOG_LEVEL: ${TC26_LOG_LEVEL:-DEBUG}
    command: ["downstream"]
